# W&B sweep — PVGIS-only ST-GNN seed-robustness check (ONLY `seed` varies).
#
# Fast-but-prudent config: batch_size=16, epochs=5 (was 8/10) to cut training
# time; predictions.csv is skipped and calibration windows are capped. Everything
# else is fixed, so the 5 runs differ only by seed.
# Train 2016,2017 -> calibrate on 2018 (group strategy) -> evaluate on 2019.
#
# Experimental question: is the result stable across seeds? Specifically, does
#   MAE rare/extreme > MAE normal   AND   uncertainty rare/extreme > normal
# hold for every seed? Watch ratio/mae_rare_normal and uncertainty/ratio_rare_normal
# (both should stay > 1 on all 5 runs).
#
# W&B sweep params are injected into the CLI by ${args_no_boolean_flags}:
# --param=value via the underscore aliases (batch_size -> --batch_size, etc.);
# boolean true params (mc_dropout, skip_predictions_csv) become bare flags.
# --out-dir uses {wandb_run_id} so the 5 runs never collide.
#
# Primary metric:   mae/rare_extreme
#
# Launch:
#   bash scripts/experiments/run_pvgis_stgnn_sweep.sh configs/sweeps/pvgis_stgnn_seed_only.yaml 5
entity: albertopedalino-politecnico-di-torino
project: PhysiQ-PV
program: main.py
method: grid
metric:
  name: mae/rare_extreme
  goal: minimize

parameters:
  # --- fixed experiment config (captured in the W&B run config) ---
  model_type:
    value: stgnn
  feature_set:
    value: full
  target_variable:
    value: pv_power_output
  seq_len:
    value: 24
  horizon:
    value: 1
  epochs:
    value: 5
  batch_size:
    value: 16
  lr:
    value: 0.001
  dropout:
    value: 0.2
  max_train_samples:
    value: 50000
  max_calibration_samples:
    value: 200000
  skip_predictions_csv:
    value: true
  mc_dropout:
    value: true
  mc_samples:
    value: 20
  clc_eta:
    value: 10
  calibration_strategy:
    value: group
  coverage_target:
    value: 0.95
  min_calibration_samples_per_stratum:
    value: 1000
  # --- the ONLY swept parameter ---
  seed:
    values: [1, 2, 3, 4, 5]

command:
  - ${env}
  - python
  - ${program}
  - --mode
  - pvgis_stgnn
  - --pvgis-dir
  - /data/SentinelPV/pvgis_data/data/pvgis_summed_irradiance
  - --train-years
  - 2016,2017
  - --calibration-years
  - "2018"
  - --test-year
  - "2019"
  - --anomaly-scores
  - outputs/pvgis_anomaly_2019_2005_2023_w15_q0975/pvgis_climatology_scores.csv
  - --calibration-anomaly-scores
  - outputs/pvgis_anomaly_2018_2005_2023_w15_q0975/pvgis_climatology_scores.csv
  - --device
  - cuda
  - --out-dir
  - outputs/wandb_pvgis_stgnn/{wandb_run_id}
  - --wandb
  - --wandb-entity
  - albertopedalino-politecnico-di-torino
  - --wandb-project
  - PhysiQ-PV
  - ${args_no_boolean_flags}
