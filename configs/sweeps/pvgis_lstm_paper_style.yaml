# W&B sweep — PVGIS-only LSTM baseline (NO graph), PAPER-STYLE uncertainty
# (NO post-hoc calibration).
#
# Identical protocol to pvgis_stgnn_seed_only_paper_style.yaml except
# model_type=lstm: a simple per-node temporal LSTM (hidden_size=64, dropout
# before the head), shared across locations, with NO adjacency / edge_index /
# spatial message passing. Same dataset, windowing (t-24..t-1 -> t), feature
# set `full`, normalisation, metrics, and eval-only anomaly labels.
# Goal: isolate the ST-GNN architecture as a factor in the low-coverage /
# under-dispersion problem.
#
# Predictive intervals are built DIRECTLY from the MC-Dropout sample
# distribution (empirical quantiles -> lower_pi/upper_pi), evaluated with
# PICP/MPIW/NMPIL/CLC. NO post-hoc calibration, NO calibration years.
#
# Training 2016,2017,2018 -> test 2019. Only `seed` varies.
#
# Primary metrics:  mae/rare_extreme, clc_pi/global, picp_pi/global
#
# Launch:
#   bash scripts/experiments/run_pvgis_stgnn_sweep.sh \
#        configs/sweeps/pvgis_lstm_paper_style.yaml 5
entity: albertopedalino-politecnico-di-torino
project: PhysiQ-PV
program: main.py
method: grid
metric:
  name: clc_pi/global
  goal: minimize

parameters:
  # --- fixed experiment config (captured in the W&B run config) ---
  model_type:
    value: lstm
  feature_set:
    value: full
  target_variable:
    value: pv_power_output
  seq_len:
    value: 24
  horizon:
    value: 1
  epochs:
    value: 5
  batch_size:
    value: 16
  lr:
    value: 0.001
  dropout:
    value: 0.2
  hidden_size:
    value: 64
  # Kept identical to the `full` paper-style sweep for a clean comparison.
  max_train_samples:
    value: 50000
  skip_predictions_csv:
    value: true
  mc_dropout:
    value: true
  mc_samples:
    value: 20
  coverage_target:
    value: 0.95
  clc_eta:
    value: 10
  # --- the ONLY swept parameter ---
  seed:
    values: [1, 2, 3, 4, 5]

command:
  - ${env}
  - python
  - ${program}
  - --mode
  - pvgis_stgnn
  - --pvgis-dir
  - /data/SentinelPV/pvgis_data/data/pvgis_summed_irradiance
  - --train-years
  - 2016,2017,2018
  - --test-year
  - "2019"
  - --anomaly-scores
  - outputs/pvgis_anomaly_2019_2005_2023_w15_q0975/pvgis_climatology_scores.csv
  - --device
  - cuda
  - --out-dir
  - outputs/wandb_pvgis_stgnn/{wandb_run_id}
  - --wandb
  - --wandb-entity
  - albertopedalino-politecnico-di-torino
  - --wandb-project
  - PhysiQ-PV
  - ${args_no_boolean_flags}
