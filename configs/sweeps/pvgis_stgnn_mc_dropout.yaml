# W&B sweep: PVGIS-only ST-GNN with MC Dropout inference.
program: main.py
method: grid
metric:
  name: mae/rare_extreme
  goal: minimize

parameters:
  feature_set:
    values: [full, no_pv_lag]
  dropout:
    values: [0.1, 0.2, 0.3]
  mc_samples:
    values: [10, 20]
  lr:
    value: 0.001
  batch_size:
    value: 8
  epochs:
    value: 10
  max_train_samples:
    value: 50000
  mc_dropout:
    value: true

command:
  - ${env}
  - python
  - ${program}
  - --mode
  - pvgis_stgnn
  - --pvgis-dir
  - /data/SentinelPV/pvgis_data/data/pvgis_summed_irradiance
  - --train-years
  - 2016,2017,2018
  - --test-year
  - "2019"
  - --anomaly-scores
  - outputs/pvgis_anomaly_2019_2005_2023_w15_q0975/pvgis_climatology_scores.csv
  - --seq-len
  - "24"
  - --horizon
  - "1"
  - --target-variable
  - pv_power_output
  - --model-type
  - stgnn
  - --device
  - cuda
  - --wandb
  - --wandb-project
  - physiq-pv-pvgis
  - ${args_no_boolean_flags}
