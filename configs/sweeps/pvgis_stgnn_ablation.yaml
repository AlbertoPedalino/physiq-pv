# W&B sweep — PVGIS-only ST-GNN feature-set + hyperparameter ablation (deterministic, no MC Dropout).
#
# Optimises MAE on the rare/extreme anomaly stratum. Runs main.py --mode pvgis_stgnn.
# Each varied parameter is emitted by ${args_no_boolean_flags} as --param=value and
# matched by the underscore-aliased CLI flags (e.g. --feature_set, --max_train_samples).
#
# Launch:
#   PYTHONPATH=$PWD wandb sweep configs/sweeps/pvgis_stgnn_ablation.yaml
#   PYTHONPATH=$PWD wandb agent <SWEEP_ID>
#
# Fixed (non-swept) run args live in `command` below — edit --pvgis-dir /
# --anomaly-scores / --train-years to match the server before launching.
program: main.py
method: grid
metric:
  name: mae/rare_extreme
  goal: minimize

parameters:
  feature_set:
    values: [full, no_pv_lag, meteo_only, irradiance_only, no_derived_irradiance]
  lr:
    values: [0.001, 0.0005]
  dropout:
    values: [0.0, 0.1, 0.2]
  batch_size:
    values: [8, 16]
  epochs:
    value: 10
  max_train_samples:
    value: 50000
  target_variable:
    value: pv_power_output

command:
  - ${env}
  - python
  - ${program}
  - --mode
  - pvgis_stgnn
  - --pvgis-dir
  - /data/SentinelPV/pvgis_data/data/pvgis_summed_irradiance
  - --train-years
  - 2016,2017,2018
  - --test-year
  - "2019"
  - --anomaly-scores
  - outputs/pvgis_anomaly_2019_2005_2023_w15_q0975/pvgis_climatology_scores.csv
  - --seq-len
  - "24"
  - --horizon
  - "1"
  - --model-type
  - stgnn
  - --device
  - cuda
  - --wandb
  - --wandb-project
  - physiq-pv-pvgis
  - ${args_no_boolean_flags}
