# W&B sweep — PVGIS-only ST-GNN, PAPER-STYLE uncertainty (NO post-hoc calibration).
#
# Predictive intervals are built DIRECTLY from the MC-Dropout sample distribution
# (empirical quantiles -> lower_pi/upper_pi) and evaluated with PICP/MPIW/NMPIL/CLC.
# There is NO post-hoc calibration in this protocol: no calibration_years, no
# calibration_strategy, no max_calibration_samples. The Gaussian band
# (mean +/- 1.96*std_raw) is logged only as a secondary diagnostic.
#
# Because there is no calibration year, training uses 2016,2017,2018 -> test 2019.
# Only `seed` varies (seed-robustness of the paper-style intervals).
#
# Primary metrics:  mae/rare_extreme, clc_pi/global, picp_pi/global
#
# Launch:
#   bash scripts/experiments/run_pvgis_stgnn_sweep.sh \
#        configs/sweeps/pvgis_stgnn_seed_only_paper_style.yaml 5
entity: albertopedalino-politecnico-di-torino
project: PhysiQ-PV
program: main.py
method: grid
metric:
  name: clc_pi/global
  goal: minimize

parameters:
  # --- fixed experiment config (captured in the W&B run config) ---
  model_type:
    value: stgnn
  feature_set:
    value: full
  target_variable:
    value: pv_power_output
  seq_len:
    value: 24
  horizon:
    value: 1
  epochs:
    value: 5
  batch_size:
    value: 16
  lr:
    value: 0.001
  dropout:
    value: 0.2
  max_train_samples:
    value: 50000
  skip_predictions_csv:
    value: true
  mc_dropout:
    value: true
  mc_samples:
    value: 20
  coverage_target:
    value: 0.95
  clc_eta:
    value: 10
  # --- the ONLY swept parameter ---
  seed:
    values: [1, 2, 3, 4, 5]

command:
  - ${env}
  - python
  - ${program}
  - --mode
  - pvgis_stgnn
  - --pvgis-dir
  - /data/SentinelPV/pvgis_data/data/pvgis_summed_irradiance
  - --train-years
  - 2016,2017,2018
  - --test-year
  - "2019"
  - --anomaly-scores
  - outputs/pvgis_anomaly_2019_2005_2023_w15_q0975/pvgis_climatology_scores.csv
  - --device
  - cuda
  - --wandb
  - --wandb-entity
  - albertopedalino-politecnico-di-torino
  - --wandb-project
  - PhysiQ-PV
  - ${args_no_boolean_flags}
