# W&B sweep — PVGIS-only ST-GNN quick/debug grid (tiny, fast smoke of the whole path).
#
# Exercises both deterministic and MC-Dropout branches with small samples/epochs.
# mc_dropout=[false, true] is a boolean param: ${args_no_boolean_flags} emits a bare
# --mc_dropout only on the true runs (and omits it on the false ones).
#
# Launch:
#   PYTHONPATH=$PWD wandb sweep configs/sweeps/pvgis_stgnn_debug.yaml
#   PYTHONPATH=$PWD wandb agent <SWEEP_ID>
program: main.py
method: grid
metric:
  name: mae/global
  goal: minimize

parameters:
  feature_set:
    values: [full, no_pv_lag]
  mc_dropout:
    values: [false, true]
  dropout:
    value: 0.2
  mc_samples:
    value: 3
  epochs:
    value: 2
  max_train_samples:
    value: 5000
  max_test_samples:
    value: 5000

command:
  - ${env}
  - python
  - ${program}
  - --mode
  - pvgis_stgnn
  - --pvgis-dir
  - /data/SentinelPV/pvgis_data/data/pvgis_summed_irradiance
  - --train-years
  - 2018
  - --test-year
  - "2019"
  - --anomaly-scores
  - outputs/pvgis_anomaly_2019_2005_2023_w15_q0975/pvgis_climatology_scores.csv
  - --seq-len
  - "24"
  - --horizon
  - "1"
  - --target-variable
  - pv_power_output
  - --model-type
  - stgnn
  - --device
  - cuda
  - --out-dir
  - outputs/wandb_pvgis_stgnn/{wandb_run_id}
  - --wandb
  - --wandb-project
  - physiq-pv-pvgis
  - ${args_no_boolean_flags}
