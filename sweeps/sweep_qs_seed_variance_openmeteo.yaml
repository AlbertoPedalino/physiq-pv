program: sweeps/sweep_qs_seed_agent.py
method: grid
metric:
  name: best_val_loss
  goal: minimize

# Offline QS-weighted training seed variance, Open-Meteo operational.
# Fixed in the agent: BILSTM_POOLING=last, QS_LOSS_WEIGHTING=1, QS_LOSS_FLOOR=0.2.
# weather_source/feature_set/openmeteo_path are read from this config, so no
# shell export is needed.
parameters:
  seed:
    values: [42, 123, 2024, 7, 31337, 2718]
  weather_source:
    value: openmeteo_historical_forecast
  feature_set:
    value: openmeteo_operational
  openmeteo_path:
    value: data/openmeteo_piedmont_2019.nc
