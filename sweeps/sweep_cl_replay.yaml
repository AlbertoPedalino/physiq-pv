program: sweeps/sweep_cl_replay_agent.py
method: grid
metric:
  name: final_mae
  goal: minimize

# 6 run = ~1 ora. Domanda: weekly vs biweekly vs monthly, seed variance.
# Peak loss mirrors the offline training setup used in main.py.
parameters:
  window_days:
    values: [7, 14, 30]
  seed:
    values: [42, 123]

  # Fixed
  replay_buffer_size:
    value: 5000
  replay_loss_weight:
    value: 1.0
  update_epochs:
    value: 1
  initial_epochs:
    value: 10
  lr:
    value: 0.001
  replay_batch_size:
    value: 8
  # Replay batch 8 -> about 4 random/low, 2 peak [0.6,1.0), 2 over_100.
  replay_peak_fraction:
    value: 0.25
  replay_over_100_fraction:
    value: 0.25
  replay_peak_threshold:
    value: 0.6
  replay_over_100_threshold:
    value: 1.0
  peak_alpha:
    value: 2.5
  peak_gamma:
    value: 2.0
  peak_loss_weight:
    value: 0.25
  under_penalty:
    value: 3.0
