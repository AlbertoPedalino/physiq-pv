program: sweeps/sweep_agent.py
method: grid
metric:
  name: best_val_loss
  goal: minimize

# Seed-only variance sweep on BiLSTM+GAT, NO input_proj, weight_decay=1e-4.
# Pool locked to 'last' (attn shown suboptimal in prior sweeps).
# seq_len=24, aligned with baseline-lstm/bilstm/bilstm-noproj configs.
parameters:
  seed:
    values: [42, 123, 2024, 7, 31337, 2718]
  bilstm_pooling:
    value: last
