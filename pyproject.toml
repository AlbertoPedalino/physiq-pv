[project]
name = "physiq-pv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "matplotlib>=3.10.0",
    "netcdf4>=1.7.4",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pvlib>=0.11.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.7.0",
    "wandb>=0.26.1",
    "xarray>=2026.4.0",
]

[tool.setuptools.packages.find]
include = ["physiq_pv*"]

[tool.uv]
torch-backend = "cu128"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
