[project]
name = "physiq-pv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "mapie>=1.3.0",
    "matplotlib>=3.10.8",
    "netcdf4>=1.7.4",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch==2.6.0",
    "tslearn>=0.8.1",
    "xarray>=2026.4.0",
]

[tool.setuptools]
packages = ["physiq_pv"]

[tool.uv]
torch-backend = "cu124"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
